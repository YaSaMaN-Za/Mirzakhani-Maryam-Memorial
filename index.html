<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicons.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Maryam Mirzakhani Memorial</title>

  <link href="/src/style.css" rel="stylesheet">

  <meta name="description"
    content="Discover the extraordinary life, groundbreaking mathematical achievements, and lasting legacy of Maryam Mirzakhani (1977-2017), the first woman to win the Fields Medal." />
  <meta name="theme-color" content="#f9f7f2" />
  <script>
    
    (function () {
      try {
        let stored = localStorage.getItem('Mm-theme');
        let theme =
          stored === 'dark' || stored === "light"
            ? stored
              : window.matchMedia("(prefers-color-scheme:dark)").matches
                ? "dark"
                : "light";
                if (theme === "dark") document.documentElement.classList.add("dark");
                document.documentElement.style.colorScheme = theme;
      } catch (e) { }
    }
    )();
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
